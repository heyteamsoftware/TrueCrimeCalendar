<!DOCTYPE html>
<!-- Plantilla de los cortos verticales (1080x1920). La usa tools/cortos/generar_corto.js:
     preparar(datos) una vez y pintar(t) en cada fotograma. Sin animaciones CSS: todo depende de t,
     así cada fotograma es exacto. Escenas: gancho, ficha, rotulo, documento, cifras, pregunta, cierre. -->
<html lang="es"><head><meta charset="utf-8"><title>Corto</title>
<style>
:root{--lamp:#d9a27a;--red:#d8432b;--card:#eae2cd;--ink:#1c1b18;--ink2:#5a554b;--pen:#1d3a72;--silk:#dcd5c2;--dim:#8f8c84;
  --cond:"Barlow Condensed",sans-serif;--sans:"Barlow",sans-serif;--mono:"IBM Plex Mono",monospace;--hand:"Mansalva",cursive}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#101211;color:var(--silk);font-family:var(--sans)}
#fondo{position:absolute;inset:-60px;background:radial-gradient(900px 900px at 50% 38%,#24221f,#101211 72%)}
#barra{position:absolute;left:0;top:0;height:10px;background:var(--lamp);z-index:5}
#marca{position:absolute;top:58px;left:0;right:0;text-align:center;font:600 26px/1 var(--mono);letter-spacing:.24em;color:var(--dim)}
#marca b{color:var(--silk);font-weight:600}
.esc{position:absolute;left:0;right:0;top:170px;height:1040px;display:none;align-items:center;justify-content:center;flex-direction:column}
/* gancho y pregunta */
.grande{text-align:center;font:700 168px/.94 var(--cond);letter-spacing:.01em;text-transform:uppercase;color:#fff;padding:0 50px}
.grande div{opacity:0}
.grande .hl{color:var(--red)}
.grande.preg div{color:#fff}
.mano{margin-top:56px;font:400 62px/1.15 var(--hand);color:var(--lamp);text-align:center;padding:0 80px;opacity:0}
/* ficha */
.ficha{width:900px;background:var(--card);color:var(--ink);border-radius:10px;box-shadow:0 26px 60px rgba(0,0,0,.6)}
.ficha .tira{display:flex;justify-content:space-between;background:var(--lamp);padding:20px 34px 16px;border-radius:10px 10px 0 0;font:700 36px/1 var(--cond);letter-spacing:.14em}
.ficha .cuerpo{padding:34px 40px 40px}
.ficha .tipo{font:700 26px/1 var(--cond);letter-spacing:.2em;color:var(--ink2)}
.ficha h1{margin-top:20px;font:700 104px/.95 var(--cond);text-transform:uppercase}
.ficha .alias{margin-top:16px;font:italic 400 42px/1.15 var(--sans);color:var(--ink2)}
.ficha .efem{margin-top:24px;font:400 48px/1.1 var(--hand);white-space:nowrap;color:var(--pen);transform:rotate(-1.5deg)}
.ficha .lugar{margin-top:26px;padding-top:22px;border-top:2px dashed rgba(0,0,0,.2);font:600 28px/1 var(--mono);letter-spacing:.06em;color:var(--ink2);text-transform:uppercase}
/* rótulo (sello) */
.sello{border:10px double var(--red);color:var(--red);padding:30px 46px 22px;font:700 124px/.95 var(--cond);letter-spacing:.04em;text-align:center;text-transform:uppercase;max-width:840px}
.sub{margin-top:50px;font:600 38px/1.3 var(--mono);letter-spacing:.12em;color:var(--dim);text-transform:uppercase;text-align:center;padding:0 60px}
.apoyo{margin-top:70px;font:400 76px/1.1 var(--hand);color:var(--silk);text-align:center;padding:0 70px}
/* documento */
.doc{width:820px;background:#e4dcc6;color:var(--ink);padding:40px 50px 50px;border-radius:6px;box-shadow:0 26px 60px rgba(0,0,0,.6);transform:rotate(-2deg)}
.doc .cab{font:700 30px/1 var(--cond);letter-spacing:.24em;color:var(--ink2);border-bottom:3px solid rgba(0,0,0,.25);padding-bottom:18px}
.doc .et{margin-top:34px;font:600 26px/1 var(--mono);letter-spacing:.14em;color:var(--ink2)}
.doc .nom{position:relative;display:inline-block;margin-top:12px;font:700 96px/1 var(--cond)}
.doc .raya{position:absolute;left:-10px;top:50%;height:12px;background:var(--red);transform:rotate(-4deg);border-radius:6px}
.doc .real{margin-top:30px;font:400 72px/1.05 var(--hand);color:var(--red);transform:rotate(-3deg);opacity:0}
/* cifras */
.cifras{display:flex;gap:70px}
.cifra{text-align:center;opacity:0}
.cifra b{display:block;font:700 330px/.9 var(--cond);color:#fff}
.cifra span{display:block;margin-top:12px;font:700 56px/1 var(--cond);letter-spacing:.12em;color:var(--lamp)}
/* cierre */
.cierre img{width:300px;height:300px;border-radius:66px;box-shadow:0 26px 70px rgba(0,0,0,.6)}
.cierre b{margin-top:56px;font:700 84px/1 var(--cond);letter-spacing:.18em;padding-left:.18em;text-align:center}
.cierre p{margin-top:26px;font:400 44px/1.3 var(--sans);text-align:center;padding:0 90px}
.cierre .boton{margin-top:56px;font:700 48px/1 var(--cond);letter-spacing:.12em;color:#151515;background:var(--lamp);padding:28px 54px 24px;border-radius:999px}
.cierre small{margin-top:34px;font:600 32px/1.4 var(--mono);letter-spacing:.08em;color:var(--dim);text-align:center}
/* subtítulos palabra a palabra */
#subs{position:absolute;left:60px;right:60px;top:1250px;text-align:center;font:700 92px/1.05 var(--cond);text-transform:uppercase;color:#fff;
  text-shadow:0 5px 0 #000,0 0 16px rgba(0,0,0,.9)}
#subs .ya{color:#fff}#subs .ahora{color:var(--lamp)}#subs .luego{color:rgba(255,255,255,.6)}
</style></head>
<body>
<div id="fondo"></div><div id="barra"></div>
<div id="marca"><b>TRUE CRIME CALENDAR</b> · <span id="mexp"></span></div>
<div id="escenas"></div>
<div id="subs"></div>
<script>
let D=null, E=[];
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>1-Math.pow(1-cl(x),3);
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9ñ]/g,"");
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");

/* momento en que se dice la primera palabra que empieza como «clave» (o una fracción de la escena) */
function cuando(e,clave,frac){
  const k=norm(clave||"");
  const p=k&&e.palabras.find(p=>{const w=norm(p.w); return w && w.slice(0,5)===k.slice(0,5);});
  return p?p.t0:e.t0+(e.t1-e.t0)*frac;
}

/* trozos de subtítulo: 2-3 palabras, cortando en la puntuación */
function trozos(pal){
  const out=[]; let cur=[];
  pal.forEach((p,i)=>{
    cur.push(p);
    const len=cur.map(x=>x.w).join(" ").length;
    if(/[.,;:!?…]$/.test(p.w) || len>=13 || cur.length>=3){ out.push(cur); cur=[]; }
  });
  if(cur.length) out.push(cur);
  return out;
}

window.preparar=async datos=>{
  D=datos;
  document.documentElement.style.setProperty("--lamp",D.lamp);
  $("mexp").textContent="EXP. "+D.exp;
  const cont=$("escenas");
  E=D.escenas.map((e,k)=>{
    const el=document.createElement("div"); el.className="esc"; el.id="e"+k;
    let h="";
    if(e.tipo==="gancho"||e.tipo==="pregunta"){
      h=`<div class="grande${e.tipo==="pregunta"?" preg":""}">${e.lineas.map((l,i)=>`<div class="${(e.destacar||[]).includes(i)?"hl":""}">${esc(l)}</div>`).join("")}</div>`+
        (e.sub?`<div class="mano">${esc(e.sub)}</div>`:"");
    } else if(e.tipo==="ficha"){
      h=`<div class="ficha"><div class="tira"><span>EXP. ${D.exp}</span><span>${D.dia}</span></div><div class="cuerpo">
        <div class="tipo">${D.estrella?"★ CASO ESTRELLA":"CASO DEL ARCHIVO"}</div><h1>${esc(D.titulo)}</h1>
        ${D.alias?`<div class="alias">${esc(D.alias)}</div>`:""}<div class="efem">${esc(D.efem)}</div>
        <div class="lugar">${esc(D.lugar)}</div></div></div>`;
    } else if(e.tipo==="rotulo"){
      h=`<div class="sello">${esc(e.rotulo)}</div>${e.sub?`<div class="apoyo">${esc(e.sub)}</div>`:""}`;
    } else if(e.tipo==="documento"){
      h=`<div class="doc"><div class="cab">DOCUMENTO DE IDENTIDAD</div><div class="et">NOMBRE</div>
        <div class="nom">${esc(e.tachado)}<i class="raya"></i></div><div class="real">${esc(e.real)}</div></div>
        ${e.sub?`<div class="sub">${esc(e.sub)}</div>`:""}`;
    } else if(e.tipo==="cifras"){
      h=`<div class="cifras">${e.cifras.map(c=>`<div class="cifra"><b>${esc(c[0])}</b><span>${esc(c[1])}</span></div>`).join("")}</div>`;
    } else if(e.tipo==="cierre"){
      el.classList.add("cierre");
      h=`<img src="${D.icono}"><b>TRUE CRIME CALENDAR</b><p>Un caso criminal real para cada día del año, contado en cintas.</p>
        <div class="boton">ESCUCHA EL CASO COMPLETO</div><small>Gratis en Google Play · sin anuncios</small>`;
    }
    el.innerHTML=h; cont.appendChild(el);
    return {...e, el, trozos:trozos(e.palabras)};
  });
  await document.fonts.ready;
  // textos grandes que no quepan: se encogen
  E.forEach(e=>{
    e.el.style.display="flex";
    e.el.querySelectorAll(".grande,.sello,.ficha h1").forEach(n=>{
      let fs=parseFloat(getComputedStyle(n).fontSize);
      while((n.scrollWidth>n.clientWidth+2 || n.offsetHeight>(n.classList.contains("grande")?760:420)) && fs>60){ fs-=6; n.style.fontSize=fs+"px"; }
    });
    e.el.style.display="none";
  });
  return E.length;
};

window.pintar=t=>{
  $("barra").style.width=(cl(t/D.duracion)*100)+"%";
  // escena activa: desde su inicio hasta el inicio de la siguiente
  let k=E.findIndex((e,i)=>t<(E[i+1]?E[i+1].t0:1e9));
  if(k<0) k=E.length-1;
  E.forEach((e,i)=>e.el.style.display=i===k?"flex":"none");
  const e=E[k], d=t-e.t0, fin=(E[k+1]?E[k+1].t0:D.duracion);
  const zoom=1+0.04*cl((t-e.t0)/Math.max(1,fin-e.t0));
  $("fondo").style.transform=`scale(${zoom})`;
  $("marca").style.opacity=(e.tipo==="gancho"||e.tipo==="cierre")?0:1;
  e.el.style.transform=`scale(${1+0.025*cl((t-e.t0)/Math.max(1,fin-e.t0))})`;
  const golpe=x=>{const a=ease(x/0.14); return {o:a, s:1.22-0.22*a};};

  if(e.tipo==="gancho"||e.tipo==="pregunta"){
    const lineas=[...e.el.querySelectorAll(".grande div")];
    lineas.forEach((n,i)=>{
      const p=e.palabras[Math.min(e.palabras.length-1,Math.floor(i*e.palabras.length/lineas.length))];
      const g=golpe(t-(p?p.t0:e.t0));
      n.style.opacity=g.o; n.style.transform=`scale(${g.s})`;
    });
    const m=e.el.querySelector(".mano");
    if(m){ const t2=cuando(e,"entonces",0.5)-0.15; m.style.opacity=ease((t-t2)/0.3); }
  } else if(e.tipo==="ficha"){
    const a=ease(d/0.35); const f=e.el.querySelector(".ficha");
    f.style.transform=`translateY(${(1-a)*80}px) rotate(${(1-a)*-3}deg)`; f.style.opacity=a;
  } else if(e.tipo==="rotulo"){
    const s=e.el.querySelector(".sello"), g=golpe(t-(e.al?cuando(e,e.al,0.3):e.t0+0.15));
    s.style.opacity=g.o; s.style.transform=`rotate(-4deg) scale(${g.s})`;
    const sb=e.el.querySelector(".apoyo"); if(sb){ const a=ease((t-e.t0)/0.3); sb.style.opacity=a; sb.style.transform=`translateY(${(1-a)*30}px) rotate(-2deg)`; }
  } else if(e.tipo==="documento"){
    const doc=e.el.querySelector(".doc"), a=ease(d/0.3);
    doc.style.opacity=a; doc.style.transform=`rotate(-2deg) translateY(${(1-a)*60}px)`;
    const tr=cuando(e,e.al||"falso",0.55)-0.25, raya=e.el.querySelector(".raya"), nom=e.el.querySelector(".nom");
    raya.style.width=(nom.offsetWidth+20)*ease((t-tr)/0.35)+"px";
    e.el.querySelector(".real").style.opacity=ease((t-tr-0.3)/0.3);
    const sb=e.el.querySelector(".sub"); if(sb) sb.style.opacity=ease((d-0.3)/0.4);
  } else if(e.tipo==="cifras"){
    [...e.el.querySelectorAll(".cifra")].forEach((n,i)=>{
      const g=golpe(t-cuando(e,e.cifras[i][1],(i+1)/(e.cifras.length+1)));
      n.style.opacity=g.o; n.style.transform=`scale(${g.s})`;
    });
  } else if(e.tipo==="cierre"){
    const a=ease(d/0.4); e.el.style.opacity=a;
    e.el.querySelector(".boton").style.transform=`scale(${1+0.035*Math.sin(Math.max(0,d)*5)})`;
  }

  // subtítulos palabra a palabra (no en gancho, pregunta ni cierre: allí el texto ya está en pantalla)
  const sub=$("subs");
  if(["gancho","pregunta","cierre"].includes(e.tipo)){ sub.innerHTML=""; return; }
  const tr=e.trozos.find((g,i)=>t>=g[0].t0-0.05 && t<(e.trozos[i+1]?e.trozos[i+1][0].t0-0.05:g[g.length-1].t1+0.3));
  if(!tr){ sub.innerHTML=""; return; }
  sub.innerHTML=tr.map(p=>`<span class="${t>=p.t1?"ya":t>=p.t0?"ahora":"luego"}">${esc(p.w)}</span>`).join(" ");
};
</script>
</body></html>
